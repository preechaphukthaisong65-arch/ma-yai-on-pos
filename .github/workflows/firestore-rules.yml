name: Firestore Rules Tests

on:
  push:
    branches:
      - feat/owner-email-auth
  pull_request:
    branches:
      - feature/complete-missing-menus
      - feat/owner-email-auth

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install rule-test dependencies
        run: npm install
      - name: Test Firestore rules in emulator
        run: npx firebase emulators:exec --only firestore --project demo-ma-yai-on-pos "npm test"
