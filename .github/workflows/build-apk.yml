name: Build MaeyaiOn POS APK
# Rebuild trigger: verify restored Build #826 application source; no app-code changes.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work/complete-pos-no-backup
      - work/clean-home-six-blank-screens
      - feature/complete-missing-menus
      - feat/owner-email-auth
      - fix/single-active-device-lock
      - feat/server-atomic-sales
      - fix/server-committed-local-sync
      - work/complete-pos-no-backup
      - fix/offline-pos-integrity-2026-10
  pull_request:
    branches:
      - main
      - feat/owner-email-auth
      - fix/single-active-device-lock
      - feat/server-atomic-sales
      - feature/manage-store-price
      - feature/warehouse-sales
      - feature/complete-missing-menus
      - fix/server-committed-local-sync

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Build signed release APK when signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::notice::Signed release APK skipped: configure all ANDROID_KEYSTORE_* and ANDROID_KEY_* repository secrets."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/maeyai-on-pos-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          export ANDROID_KEYSTORE_FILE="$KEYSTORE_PATH"
          gradle --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maeyai-on-pos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: maeyai-on-pos-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
