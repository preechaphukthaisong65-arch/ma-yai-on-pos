name: Build MaeyaiOn POS APK
# Rebuild trigger: verify restored Build #826 application source; no app-code changes.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work/complete-pos-no-backup
      - work/clean-home-six-blank-screens
      - feature/complete-missing-menus
      - feat/owner-email-auth
      - fix/single-active-device-lock
      - feat/server-atomic-sales
      - fix/server-committed-local-sync
      - work/complete-pos-no-backup
      - fix/offline-pos-integrity-2026-10
  pull_request:
    branches:
      - main
      - feat/owner-email-auth
      - fix/single-active-device-lock
      - feat/server-atomic-sales
      - feature/manage-store-price
      - feature/warehouse-sales
      - feature/complete-missing-menus
      - fix/server-committed-local-sync

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build APK
        env:
          MAEYAI_KEYSTORE_BASE64: ${{ secrets.MAEYAI_KEYSTORE_BASE64 }}
          MAEYAI_STORE_PASSWORD: ${{ secrets.MAEYAI_STORE_PASSWORD }}
          MAEYAI_KEY_ALIAS: ${{ secrets.MAEYAI_KEY_ALIAS }}
          MAEYAI_KEY_PASSWORD: ${{ secrets.MAEYAI_KEY_PASSWORD }}
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug
          if [ -n "$MAEYAI_KEYSTORE_BASE64" ] && [ -n "$MAEYAI_STORE_PASSWORD" ] && [ -n "$MAEYAI_KEY_ALIAS" ] && [ -n "$MAEYAI_KEY_PASSWORD" ]; then
            echo "$MAEYAI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/maeyai-release.jks"
            export MAEYAI_STORE_FILE="$RUNNER_TEMP/maeyai-release.jks"
            gradle --no-daemon assembleRelease
          else
            echo "Release signing secrets are not configured; only the debug APK will be produced."
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maeyai-on-pos-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
