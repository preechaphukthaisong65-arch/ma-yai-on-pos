name: Build MaeyaiOn POS APK
# Rebuild trigger: verify restored Build #826 application source; no app-code changes.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feat/owner-email-auth
      - fix/single-active-device-lock
      - feat/server-atomic-sales
      - feature/manage-store-price
      - feature/warehouse-sales
      - feature/complete-missing-menus
      - fix/server-committed-local-sync

concurrency:
  group: pos-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and publish test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maeyai-on-pos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  migration-test:
    name: Android emulator database migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run database migration instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 is more stable on GitHub-hosted Linux runners than API 35 for this AVD.
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -wipe-data -noaudio -no-boot-anim
          # This action executes script lines as separate shell commands; keep the Gradle invocation atomic.
          script: gradle --no-daemon connectedDebugAndroidTest --stacktrace

      - name: Upload emulator diagnostics and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-emulator-diagnostics
          path: |
            migration-debug/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14

  release-signing:
    name: Build production-signed release APK
    # Keep production signing out of pull_request jobs. Run manually after configuring the
    # repository secrets, or automatically on pushes to main.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MAEYAI_KEYSTORE_BASE64: ${{ secrets.MAEYAI_KEYSTORE_BASE64 }}
      MAEYAI_KEYSTORE_PASSWORD: ${{ secrets.MAEYAI_KEYSTORE_PASSWORD }}
      MAEYAI_KEY_ALIAS: ${{ secrets.MAEYAI_KEY_ALIAS }}
      MAEYAI_KEY_PASSWORD: ${{ secrets.MAEYAI_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate existing production signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in MAEYAI_KEYSTORE_BASE64 MAEYAI_KEYSTORE_PASSWORD MAEYAI_KEY_ALIAS MAEYAI_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: ${name}"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/maeyai-production.jks"
          printf '%s' "$MAEYAI_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -keystore "$keystore" -storepass "$MAEYAI_KEYSTORE_PASSWORD" -alias "$MAEYAI_KEY_ALIAS" >/dev/null
          echo "MAEYAI_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build production-signed release APK
        run: gradle --no-daemon testDebugUnitTest assembleRelease --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: maeyai-on-pos-production-signed-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
