name: Build MaeyaiOn POS APK
# Rebuild trigger: verify restored Build #826 application source; no app-code changes.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feat/owner-email-auth
      - fix/single-active-device-lock
      - feat/server-atomic-sales
      - feature/manage-store-price
      - feature/warehouse-sales
      - feature/complete-missing-menus
      - fix/server-committed-local-sync

concurrency:
  group: pos-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and publish test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maeyai-on-pos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  migration-test:
    name: Android emulator database migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run database migration instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set +e
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            gradle --no-daemon connectedDebugAndroidTest --stacktrace
            test_status=$?
            if [ "$test_status" -ne 0 ]; then
              mkdir -p migration-debug
              adb logcat -d -v threadtime > migration-debug/logcat.txt 2>&1 || true
              adb shell dumpsys activity processes > migration-debug/activity-processes.txt 2>&1 || true
              adb shell getprop > migration-debug/getprop.txt 2>&1 || true
              find app/build/reports/androidTests app/build/outputs/androidTest-results -type f -print 2>/dev/null > migration-debug/test-files.txt || true
              echo "Instrumentation failed with exit code $test_status; diagnostic files will be uploaded."
            fi
            exit "$test_status"

      - name: Upload emulator diagnostics and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-emulator-diagnostics
          path: |
            migration-debug/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
