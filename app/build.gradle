plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
}

android {
    namespace 'com.example.newapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.newapp'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            def storePath = System.getenv("MAEYAI_STORE_FILE")
            if (storePath != null && !storePath.isEmpty()) {
                storeFile file(storePath)
                storePassword System.getenv("MAEYAI_STORE_PASSWORD")
                keyAlias System.getenv("MAEYAI_KEY_ALIAS")
                keyPassword System.getenv("MAEYAI_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("MAEYAI_STORE_FILE") != null && !System.getenv("MAEYAI_STORE_FILE").isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
