plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.newapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.newapp'
        minSdk 23
        targetSdk 28

        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
