plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}

def releaseSigningValues = [
    System.getenv('MAEYAI_KEYSTORE_PATH'),
    System.getenv('MAEYAI_KEYSTORE_PASSWORD'),
    System.getenv('MAEYAI_KEY_ALIAS'),
    System.getenv('MAEYAI_KEY_PASSWORD')
]
def releaseSigningConfigured = releaseSigningValues.every { it != null && !it.trim().isEmpty() }

android {
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(System.getenv('MAEYAI_KEYSTORE_PATH'))
                storePassword System.getenv('MAEYAI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MAEYAI_KEY_ALIAS')
                keyPassword System.getenv('MAEYAI_KEY_PASSWORD')
            }
        }
    }

    namespace 'com.example.newapp'
    compileSdk 35

    buildTypes {
        release {
            // Release builds are signed only when the existing production keystore is supplied.
            // Never fall back to the debug key for a production release.
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    defaultConfig {
        applicationId 'com.example.newapp'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
